name: check
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b
        with:
          install_url: https://releases.nixos.org/nix/nix-2.35.1/install
          enable_kvm: false
          extra_nix_config: |
            experimental-features = nix-command flakes pipe-operators
            sandbox = true
            always-allow-substitutes = false
      - name: Install the locked devenv CLI
        run: |
          set -euo pipefail
          nix profile add github:cachix/devenv/b904dcb51fe48c30db250038241507f60752f222#devenv
          devenv version
      - name: Prepare dependencies
        run: |
          set -euo pipefail
          devenv shell python3 tools/workspace.py prepare
      - name: Run the locked offline gate
        run: |
          set -euo pipefail
          devenv test
